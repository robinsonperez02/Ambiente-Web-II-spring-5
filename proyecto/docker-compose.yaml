services:
  services:
    postgres:
      image: postgres:16
      container_name: postgres-cursos
      environment:
        POSTGRES_DB: curso_springboot
        POSTGRES_USER: devdb
        POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      restart: unless-stopped

  volumes:
    postgres_data:
